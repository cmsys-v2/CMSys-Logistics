  <!-- divider -->
  <rect x="5" y="176" width="176" height="3.4" rx="1.7" fill="url(#divider)"/>

  <!-- TRINCOMALEE -->
  <text x="332" y="190" font-family="'Segoe UI',Arial,sans-serif" font-size="25" font-weight="600"
        letter-spacing="6.4" fill="#f4c563">TRINCOMALEE</text>
